# Desktop: one 4K monitor on DisplayPort. Tune live with: swaymsg output '*' scale 1.75
output * scale 1.5

# Same bar as the i3 setup: swaybar fed by statusbar (it speaks the i3bar protocol).
bar bar-0 swaybar_command swaybar
bar bar-0 status_command statusbar
bar bar-0 position top
bar bar-0 font pango:JetBrainsMono NF 11

# The two extra brightness keys on this keyboard, as in i3.
bindsym XF86Mail     exec wl-brightness +0.05, exec statusbar-poke
bindsym XF86HomePage exec wl-brightness -0.05, exec statusbar-poke

# Same weather-map wallpaper as the i3 setup; zoom-earth-wallpaper refreshes it from cron.
output * background $HOME/Downloads/wallpapers/zoom-earth-precipitation.png fill #07080d

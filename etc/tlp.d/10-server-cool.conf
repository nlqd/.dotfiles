# Docked-server CPU policy. TLP owns the CPU energy-perf preference and resets it
# on every AC/battery transition, so this has to live in TLP, not a sysfs write.
#
# On AC (lid-closed home server idling 24/7) TLP's default balance_performance
# lets cores burst to 4.2 GHz for trivial work and bake the closed chassis. The
# 'power' bias keeps idle/burst voltage low so the box runs cool overnight.
#
# Deliberately scoped to AC only. The battery path is left at TLP's default
# (power-saving) so portable runtime is unchanged -- the docked box was the only
# thing too hot.
#
# Install per machine: rootsync --apply (it also runs tlp start).
# Reverse: sudo rm /etc/tlp.d/10-server-cool.conf && sudo tlp start
CPU_ENERGY_PERF_POLICY_ON_AC=power

# Dell thermal profile on AC. TLP's default is 'performance' (BIOS UltraPerformance),
# which overrides etc/udev/rules.d/90-thermal-ac.rules whenever tlp start or an AC
# event runs after it (seen 2026-10-17: platform_profile read 'performance' on AC).
# Battery stays at TLP's default, balanced, which is what the udev rule sets too.
PLATFORM_PROFILE_ON_AC=cool

# Optional max-cool while docked: also cap turbo so load spikes top out at the
# ~1.4 GHz base instead of 4.2 GHz. Helps only under active load, not idle.
#CPU_BOOST_ON_AC=0
